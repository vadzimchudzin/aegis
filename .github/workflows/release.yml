name: release

"on":
  push:
    branches:
      - release/0.7.0-beta.6
    tags:
      - "v*"
  workflow_dispatch:

# The branch-created tag uses GITHUB_TOKEN and normally does not retrigger push.
# Isolate by tested commit so a stalled obsolete verification cannot block the current one.
# Preflight and final publication still bind the immutable tag to the tested SHA.
concurrency:
  group: release-${{ github.ref == 'refs/heads/release/0.7.0-beta.6' && 'v0.7.0-beta.6' || github.ref_name }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Cancel older attempts for this beta branch
        if: github.ref == 'refs/heads/release/0.7.0-beta.6'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: current } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: context.runId });
            const { data } = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: 'release.yml', branch: 'release/0.7.0-beta.6', per_page: 100 });
            for (const run of data.workflow_runs) {
              if (run.id === context.runId || Date.parse(run.created_at) >= Date.parse(current.created_at)) continue;
              if (!['queued', 'in_progress', 'pending', 'waiting', 'requested'].includes(run.status)) continue;
              try { await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id }); }
              catch (error) { if (error.status !== 409) throw error; }
            }
      - name: Drop a stale draft bound to another commit
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release/0.7.0-beta.6'
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ github.ref == 'refs/heads/release/0.7.0-beta.6' && 'v0.7.0-beta.6' || github.ref_name }}
        with:
          script: |
            // The Tauri action reuses a draft it finds by tag but never updates its target
            // commit, so a draft left by an earlier commit would fail the publish gate and
            // block every later attempt. Remove only drafts bound to a different commit;
            // a published release is handled by the next step.
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            for (const release of releases.filter(candidate => candidate.tag_name === tag && candidate.draft)) {
              const target = String(release.target_commitish || '').toLowerCase();
              if (target === context.sha.toLowerCase()) continue;
              core.info(`Deleting stale draft ${release.id} bound to ${release.target_commitish}`);
              await github.rest.repos.deleteRelease({ owner, repo, release_id: release.id });
            }
      - name: Reject published release or mismatched existing tag
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release/0.7.0-beta.6'
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ github.ref == 'refs/heads/release/0.7.0-beta.6' && 'v0.7.0-beta.6' || github.ref_name }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              if (!release.draft) throw new Error(`Release ${tag} is already published; refusing asset re-upload`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              const { data: commit } = await github.rest.repos.getCommit({ owner, repo, ref: tag });
              if (commit.sha !== context.sha) throw new Error(`Existing ${tag} does not point to this checkout; refusing release`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }

  verify:
    needs: preflight
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check package versions and release branch
        shell: python
        run: |
          import json, os, pathlib, tomllib
          root = pathlib.Path('.')
          version = tomllib.loads((root / 'Cargo.toml').read_text())['workspace']['package']['version']
          assert json.loads((root / 'app/package.json').read_text())['version'] == version
          lock = json.loads((root / 'app/package-lock.json').read_text())
          assert lock['version'] == lock['packages']['']['version'] == version
          assert json.loads((root / 'app/src-tauri/tauri.conf.json').read_text())['version'] == version
          packages = tomllib.loads((root / 'Cargo.lock').read_text())['package']
          local = [p for p in packages if p['name'] in ('aegis-core', 'aegis-app') and 'source' not in p]
          assert len(local) == 2 and all(p['version'] == version for p in local)
          if os.environ['GITHUB_REF'] == 'refs/heads/release/0.7.0-beta.6':
              assert version == '0.7.0-beta.6'
          print('Consistent package version:', version)
      - name: Rust format check
        run: cargo fmt --all -- --check
      - name: Rust core lint
        run: cargo clippy -p aegis-core --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Python bridge tests (optional research extras may skip)
        run: python -m unittest discover -s tests -v
        working-directory: python
      - run: npm ci
        working-directory: app
      - name: JavaScript syntax check
        shell: python
        run: |
          import pathlib, subprocess
          for source in sorted(pathlib.Path('app/ui').glob('*.js')):
              subprocess.run(['node', '--check', str(source)], check=True)
      - run: npm test
        working-directory: app

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            targets: ""
            args: --bundles deb
          - os: windows-latest
            targets: ""
            args: --bundles nsis
          - os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
      # The workspace test spawns the Python mock venue (scripts/mock_venues.py), so the
      # interpreter has to exist before `cargo test` runs. On Windows `python3` without an
      # installed interpreter resolves to the Microsoft Store alias and the step hangs.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cargo test --workspace --locked
        env:
          AEGIS_TEST_PYTHON: python
      - name: Python bridge tests (optional research extras may skip)
        run: python -m unittest discover -s tests -v
        working-directory: python
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app
      - name: Load beta release notes
        id: notes
        if: github.ref == 'refs/heads/release/0.7.0-beta.6' || github.ref == 'refs/tags/v0.7.0-beta.6'
        shell: python
        run: |
          import os, pathlib, uuid
          body = pathlib.Path('docs/release-beta6.md').read_text(encoding='utf-8')
          delimiter = 'NOTES_' + uuid.uuid4().hex
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('body<<' + delimiter + '\n' + body + '\n' + delimiter + '\n')
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: ${{ matrix.args }}
          tagName: ${{ github.ref == 'refs/heads/release/0.7.0-beta.6' && 'v0.7.0-beta.6' || startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: AEGIS ${{ (github.ref == 'refs/heads/release/0.7.0-beta.6' || github.ref == 'refs/tags/v0.7.0-beta.6') && '0.7.0-beta.6' || github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseCommitish: ${{ github.sha }}
          # Keep all uploads private until the full matrix and asset checks succeed.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release/0.7.0-beta.6'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify all installers and publish release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ github.ref == 'refs/heads/release/0.7.0-beta.6' && 'v0.7.0-beta.6' || github.ref_name }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            // A draft release has no git tag yet: GitHub creates the tag only when the draft is
            // published, and getReleaseByTag() cannot see drafts at all. Looking the release up
            // by tag therefore returned 404 on our own draft, so nothing could ever be published.
            // Find the draft by listing releases and bind the tested commit via target_commitish.
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            const release = releases.find(candidate => candidate.tag_name === tag);
            if (!release) throw new Error(`No release entry for ${tag}; the build matrix uploaded nothing`);
            if (!release.draft) throw new Error(`Release ${tag} is already published; refusing asset re-upload`);
            const target = String(release.target_commitish || '').toLowerCase();
            if (target !== context.sha.toLowerCase()) {
              const { data: commit } = await github.rest.repos.getCommit({ owner, repo, ref: release.target_commitish });
              if (commit.sha.toLowerCase() !== context.sha.toLowerCase()) {
                throw new Error(`Draft ${tag} targets ${release.target_commitish}, not the tested ${context.sha}`);
              }
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id: release.id, per_page: 100 });
            for (const extension of ['.exe', '.deb', '.dmg']) {
              if (!assets.some(asset => asset.name.toLowerCase().endsWith(extension) && asset.size > 0 && asset.state === 'uploaded')) {
                throw new Error(`Missing nonempty uploaded ${extension} installer; release remains draft`);
              }
            }
            const prerelease = tag === 'v0.7.0-beta.6' || tag.includes('-beta') || tag.includes('-alpha');
            const { data: published } = await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, draft: false, prerelease });
            if (published.draft || published.prerelease !== prerelease) throw new Error('Release publication state verification failed');
            core.summary.addHeading('Verified release installers');
            for (const asset of assets) core.summary.addRaw(`${asset.name} (${asset.size} bytes)\n`);
            core.summary.addLink('Published release', published.html_url);
            await core.summary.write();
